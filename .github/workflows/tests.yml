name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python paper/verify_results.py
      - run: python paper/verify_non_atomicity.py
      - run: python -m build
      - name: Smoke test installed command outside the checkout
        working-directory: ${{ runner.temp }}
        run: rational-sumring-lab --q 2/5 --r 2/3 --degree 1 --coefficients 1
