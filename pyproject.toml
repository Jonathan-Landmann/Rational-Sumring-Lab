[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rational-sumring-lab"
version = "0.4.0"
description = "Exact arithmetic and certified experiments for rational sumrings"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
rational-sumring-lab = "cli:main"

[tool.setuptools]
py-modules = ["sumrings", "effective_primes", "certificates", "cli", "dyadic_semiring"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
